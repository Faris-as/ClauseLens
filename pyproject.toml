[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clauselens"
version = "0.1.0"
description = "Bilingual (EN/AR) Contract Intelligence Assistant"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Faris Abdul Sukkur", email = "faris@example.com" }
]
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
    "psycopg[binary]>=3.1.18",
    "pgvector>=0.3.0",
    "pymupdf>=1.24.0",
    "opencv-python-headless>=4.9.0",
    "easyocr>=1.7.1",
    "httpx>=0.27.0",
    "redis>=5.0.0",
    "rq>=1.16.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[argon2]>=1.7.4",
    "argon2-cffi>=23.1.0",
    "python-multipart>=0.0.9",
    "python-bidi>=0.4.2",
    "arabic-reshaper>=3.0.0",
    "streamlit>=1.35.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.8",
    "mypy>=1.10.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "C4", "T20", "PT"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
exclude = ["tests/", "eval/"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
